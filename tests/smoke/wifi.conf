CONFIG_ZEST_WIFI_MANAGER=y

CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_DHCPV4=y
CONFIG_NET_SOCKETS=y
CONFIG_WIFI=y

# Without this the NET_REQUEST_WIFI_* handlers are not compiled, so anything
# that actually calls WifiManager fails to link. The previous smoke test only
# named these methods in static_asserts, so --gc-sections discarded them and the
# gap stayed hidden.
CONFIG_NET_L2_WIFI_MGMT=y

CONFIG_TEST_RANDOM_GENERATOR=y
