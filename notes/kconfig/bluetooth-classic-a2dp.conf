# REFERENCE ONLY --- see notes/kconfig/README.md. The comments are the content;
# every number here was measured on one specific build and is wrong for a
# different SoC, controller image, or peer. Do not include this file.
#
# --- Classic A2DP sink (SBC) ---
#
# From a speaker that a phone streams to over Bluetooth Classic, on an
# ESP32-WROOM-32. The buffer sizes here were set against what real peers
# actually send rather than against the spec minimum, which is the reason
# the defaults produce a stream that connects and is silent.
CONFIG_BT=y
CONFIG_BT_CLASSIC=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_SMP=y
CONFIG_BT_SETTINGS=y
CONFIG_BT_AVDTP=y
CONFIG_BT_A2DP=y
CONFIG_BT_A2DP_SINK=y
# Passive LE observer for the out-of-band "baby asleep" beacon that the
# bmonitor host broadcasts (src/controls/sleep_signal.cpp). The ESP32 radio is
# dual-mode, so this scans alongside the BR/EDR A2DP sink; the scan runs at a
# low duty cycle so an active stream keeps the radio. No connection is made, so
# BT_MAX_CONN is unaffected.
CONFIG_BT_OBSERVER=y
CONFIG_BT_DEVICE_NAME="Baby Speaker"
CONFIG_BT_COD=0x200404
CONFIG_BT_BUF_ACL_RX_SIZE=1300
# A speaker is paired once per device and then lives with several of them.
# Zephyr's default pool of one link key silently stalls the second device:
# bt_hci_link_key_notify() cannot allocate a slot, returns without answering
# the controller, and the peer sits on "Pairing..." until it gives up with no
# error.  Recycling the oldest key keeps that from ever being a dead end.
CONFIG_BT_MAX_PAIRED=4
CONFIG_BT_KEYS_OVERWRITE_OLDEST=y
# One ACL slot meant a device that was already connected -- a laptop that
# reconnected on its own, say -- turned every other device away.  The host
# rejects with "insufficient resources" from bt_hci_conn_req() before a
# bt_conn exists, so nothing is logged and the blocked phone just fails.
CONFIG_BT_MAX_CONN=2
# Without host ACL flow control the ACL receive pool is sized
# BT_BUF_EVT_RX_COUNT + BT_BUF_ACL_RX_COUNT buffers (hci_common_internal.h), so
# every HCI *event* buffer silently costs a full BT_BUF_ACL_RX_SIZE of RAM --
# 1300 bytes here.  Zephyr's default of 20 events therefore bought a 25-buffer,
# 30 KB pool out of the 96 KB of SRAM1 that holds every thread stack.  Eleven is
# the floor the buffer BUILD_ASSERT allows against BT_BUF_ACL_TX_COUNT=10, and
# is ample for one A2DP sink; it returns nearly 12 KB.
CONFIG_BT_BUF_EVT_RX_COUNT=11
# The A2DP media callback runs on the host RX thread, on top of the L2CAP,
# AVDTP and A2DP receive path.  Zephyr's 1200-byte default is sized for LE;
# BR/EDR connection setup plus the SSP exchange needs more headroom still.
CONFIG_BT_RX_STACK_SIZE=3072
