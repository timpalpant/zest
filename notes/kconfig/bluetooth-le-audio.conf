# REFERENCE ONLY --- see notes/kconfig/README.md. The comments are the content;
# every number here was measured on one specific build and is wrong for a
# different SoC, controller image, or peer. Do not include this file.
#
# --- LE Audio unicast: a peripheral link and a central link at once ---
#
# From a device that receives LE Audio from a phone (peripheral, CAP
# Acceptor) and re-transmits it to earbuds (central, BAP Unicast Client) on
# an nRF5340: application core running the host, network core running an
# hci_ipc controller image. The cross-core coupling below is the part that
# does not survive being copied to a single-core part.
# Real-time budget for the audio path.
#
# At steady state the audio thread does 2x LC3 decode + 5 biquads/ear + 2x LC3
# encode every 10 ms. Built for size (Zephyr's default) that does not fit: once
# both links stream, the audio thread overruns its deadline and starves
# everything below it — logging, the shell, and the 100 Hz control thread, so
# the media buttons stop responding and the audio glitches. FLASH is only ~40%
# used, so trading size for speed is free here. Nordic's own LE Audio
# application (nrf/applications/nrf_audio) sets the same option.
CONFIG_SPEED_OPTIMIZATIONS=y
# nrfx clock driver, for selecting the 128 MHz app-core clock in main().
CONFIG_NRFX_CLOCK=y
CONFIG_FPU=y
CONFIG_BT=y
CONFIG_BT_SMP=y
# Required for re-pairing to work at all on this device.
#
# We have no display and no keypad, so IO capability is NoInputNoOutput and
# every bond we form is Just Works, i.e. unauthenticated. Zephyr's
# update_keys_check() (host/smp.c) refuses a Just Works pairing whenever an
# unauthenticated bond for that peer already exists, as anti-downgrade
# protection, and returns BT_SMP_ERR_AUTH_REQUIREMENTS. Android surfaces that
# as "Couldn't pair ... because of an incorrect PIN or passkey", which is
# thoroughly misleading — there is no PIN anywhere in a Just Works exchange.
#
# The practical effect with this option off: the *first* pair after a bond
# clear succeeds, and every later re-pair from the same phone fails forever,
# because the phone forgetting us does not delete our copy of the bond. The
# Kconfig help spells out the alternative — "the old bond has to be explicitly
# deleted with bt_unpair" — which is not something a user can do from a phone.
#
# Trade-off, accepted deliberately: an attacker who spoofs a bonded peer's
# address can replace an unauthenticated bond. Just Works is already
# unauthenticated and MITM-vulnerable by construction on a device with no
# input/output, so this concedes nothing that pairing had to begin with.
CONFIG_BT_SMP_ALLOW_UNAUTH_OVERWRITE=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_CENTRAL=y
# SPEC 11.3: upstream (peripheral, from phone) and downstream (central, to
# headset) ACLs must coexist. The Zephyr default of 1 connection/1 bond
# allows only one side.
# 3, not 2, for two ACLs. Connectable advertising is itself a pool consumer:
# bt_le_ext_adv_start() parks a bt_conn in BT_CONN_ADV_CONNECTABLE waiting for
# an initiator. So "phone ACL + headset ACL + advertiser waiting for the phone
# to come back" needs three, and during a disconnect there is a fourth-ish
# moment where the conn that just dropped has not been recycled yet. At 2 the
# advertiser silently fails to restart with -ENOMEM once the headset is up, and
# the phone is left with nothing to connect to. The net core allows 3
# (hci_ipc: CONFIG_BT_MAX_CONN=3), so the host may go to 3 as well.
CONFIG_BT_MAX_CONN=3
# 4, not 2. One headset + one phone fills a table of 2 exactly, and with
# BT_KEYS_OVERWRITE_OLDEST any third pairing then silently evicts a bond that
# the peer still believes in — which shows up on the phone as "incorrect
# passkey" / refusing to re-pair, because the two sides disagree about the LTK.
CONFIG_BT_MAX_PAIRED=4
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=n
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=50
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=70
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400
CONFIG_BT_ISO_PERIPHERAL=y
CONFIG_BT_ISO_CENTRAL=y
CONFIG_BT_AUDIO=y
CONFIG_BT_GATT_DYNAMIC_DB=y
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_GATT_AUTO_DISCOVER_CCC=y
# Required by CONFIG_BT_BAP_UNICAST_CLIENT (downstream sender scans+connects
# as central, so it needs to actually get to Central role and back).
CONFIG_BT_GATT_AUTO_UPDATE_MTU=y
# The phone talks CAP, not bare BAP. A CAP Acceptor must expose the Common
# Audio Service, and CAS is instantiated *only* by BT_CAP_ACCEPTOR (see
# zephyr/subsys/bluetooth/audio/cap_acceptor.c — BT_GATT_SERVICE_DEFINE(cas_svc,
# BT_GATT_PRIMARY_SERVICE(BT_UUID_CAS))). Without it we advertised ASCS + PACS
# only, so a phone would bond, discover, find no CAS, decide we are not an LE
# Audio device and drop the link. Zephyr's own samples/bluetooth/cap_acceptor
# enables exactly this on top of the same ASCS/PAC options below.
CONFIG_BT_CAP_ACCEPTOR=y
# Volume Control Service. A CAP Acceptor that renders audio is expected to
# expose VCS so the phone's volume slider has something to talk to; it is wired
# to the master output gain alongside the volume pot (SPEC 8.3).
CONFIG_BT_VCP_VOL_REND=y
CONFIG_BT_VCP_VOL_REND_VOCS_INSTANCE_COUNT=0
CONFIG_BT_VCP_VOL_REND_AICS_INSTANCE_COUNT=0
CONFIG_BT_BAP_UNICAST_SERVER=y
CONFIG_BT_BAP_UNICAST_CLIENT=y
CONFIG_BT_ASCS=y
CONFIG_BT_PAC_SNK=y
CONFIG_BT_ASCS_MAX_ASE_SNK_COUNT=2
CONFIG_BT_PAC_SRC=y
CONFIG_BT_ASCS_MAX_ASE_SRC_COUNT=1
# The WH-1000XM6 (and Sony headsets generally) expose more than 2 sink ASEs
# — media / conversational / gaming. Caching only 2 makes ASCS discovery abort
# with -ENOMEM ("No space left to parse ASE", bap_unicast_client.c) after the
# first endpoint. 5 covers Sony's set with margin.
CONFIG_BT_BAP_UNICAST_CLIENT_ASE_SNK_COUNT=8
CONFIG_BT_BAP_UNICAST_CLIENT_ASE_SRC_COUNT=2
# BAP client discovery/config logging. Kept at the default level: at DBG this
# module floods the 115200 UART during streaming, overflowing the deferred log
# buffer so that messages (including the shell's own output) are dropped and
# `eq stats` cannot be read while audio is playing.
CONFIG_BT_BAP_UNICAST_CLIENT_LOG_LEVEL_INF=y
CONFIG_BT_BAP_UNICAST_CLIENT_GROUP_STREAM_COUNT=4
CONFIG_BT_ISO_TX_BUF_COUNT=4
CONFIG_BT_ISO_RX_BUF_COUNT=4
CONFIG_BT_ISO_MAX_CHAN=4
# Two CIGs: the phone owns the upstream CIS's group, we own the downstream
# one. At the default of 1 the host has no free CIG for the downstream stream
# once the phone is streaming. Mirrored on the net core by
# sysbuild/hci_ipc.conf (CONFIG_BT_CTLR_CONN_ISO_GROUPS=2).
CONFIG_BT_ISO_MAX_CIG=2
# SPEC 13: one CIS carries a 2-channel LC3 SDU each way (2 x 100 = 200 octets
# for 48_2_1; headroom to 2 x 155 for a peer that maxes octets-per-frame).
CONFIG_BT_ISO_TX_MTU=320
CONFIG_BT_ISO_RX_MTU=320
# The stereo codec config carries an Audio_Channel_Allocation LTV on top of
# freq / duration / frame-length / frame-blocks; the 20-byte default is tight.
CONFIG_BT_AUDIO_CODEC_CFG_MAX_DATA_SIZE=40
# Match the net-core ISO controller's ACL buffer sizes (net core:
# samples/bluetooth/hci_ipc/nrf5340_cpunet_iso-bt_ll_sw_split.conf —
# BT_BUF_ACL_RX_SIZE=255 / BT_BUF_ACL_TX_SIZE=251 / BT_CTLR_DATA_LENGTH_MAX=251).
# The controller does not fragment to the host, so bt_enable()'s
# HCI_Host_Buffer_Size handshake is rejected (opcode 0x0c33 status 0x12 ->
# bt_enable -EINVAL) unless the host's ACL packet length is >= the controller's.
CONFIG_BT_BUF_ACL_RX_SIZE=255
CONFIG_BT_BUF_ACL_TX_SIZE=251
# On connect the stack runs MTU exchange + data-length update + SMP pairing at
# once, and then BAP discovery fires a long burst of GATT reads/subscribes at
# the XM6. With the default counts (3/3) the auto MTU exchange loses the race
# with -ENOMEM, ATT stays at 23 bytes, discovery crawls and the headset drops
# us (0x15 "remote low resources"). Roomier host-side ATT/L2CAP TX pools fix it.
# NOTE: do NOT bump CONFIG_BT_BUF_ACL_TX_COUNT here — that count must match the
# net-core controller (hci_ipc: 3). A mismatch corrupts bt_conn_tx accounting
# and makes bt_le_ext_adv_start() fail -ENOMEM on the upstream side.
CONFIG_BT_ATT_TX_COUNT=10
CONFIG_BT_L2CAP_TX_BUF_COUNT=10
CONFIG_BT_AUDIO_CODEC_CFG_MAX_METADATA_SIZE=10
CONFIG_BT_ATT_PREPARE_COUNT=2
CONFIG_BT_EXT_ADV=y
CONFIG_BT_DEVICE_NAME="Bluetooth EQ"
CONFIG_LIBLC3=y
CONFIG_BT_MCC=y
CONFIG_BT_MCC_SHELL=n
CONFIG_BT_MCC_SET_MEDIA_CONTROL_POINT=y
CONFIG_BT_SETTINGS=y
CONFIG_SETTINGS=y
CONFIG_NVS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_BT_KEYS_OVERWRITE_OLDEST=y
CONFIG_UTF8=y
# Must be >= the ATT/L2CAP TX buffer counts bumped above (Kconfig enforces it).
CONFIG_BT_CONN_TX_MAX=12
CONFIG_BT_L2CAP_TX_MTU=300
