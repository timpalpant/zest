name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Zephyr smoke build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build gperf ccache device-tree-compiler \
            python3-dev python3-pip python3-setuptools python3-wheel xz-utils
          python3 -m pip install --user west
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Create a minimal Zephyr workspace
        run: |
          west init -m https://github.com/zephyrproject-rtos/zephyr \
            --mr v4.4.2 zephyr-workspace
          cd zephyr-workspace
          west update --narrow -o=--depth=1
          west zephyr-export
          python3 -m pip install --user -r zephyr/scripts/requirements-base.txt

      - name: Build every component
        env:
          ZEPHYR_TOOLCHAIN_VARIANT: host
        run: |
          cd zephyr-workspace
          for component in battery http wifi bluetooth; do
            extra_conf=""
            if [ "$component" != battery ]; then
              extra_conf="-DEXTRA_CONF_FILE=$GITHUB_WORKSPACE/tests/smoke/$component.conf"
            fi
            west build -d "$GITHUB_WORKSPACE/build/$component" \
              -b native_sim/native/64 "$GITHUB_WORKSPACE/tests/smoke" -- \
              -DZEPHYR_EXTRA_MODULES="$GITHUB_WORKSPACE" $extra_conf
          done

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate API reference
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends doxygen
          doxygen Doxyfile
          test -f build/docs/html/index.html

  format:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check clang-format
        run: |
          find include src tests -type f \( -name '*.cpp' -o -name '*.hpp' \) -print0 \
            | xargs -0 clang-format --dry-run --Werror
